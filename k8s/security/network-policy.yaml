---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: app-workload
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns-egress
  namespace: app-workload
spec:
  podSelector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values:
          - go-telemetry-api
          - traffic-generator
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-monitoring-and-ingress
  namespace: app-workload
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: go-telemetry-api
  policyTypes:
    - Ingress
  ingress:
    # 1. Prometheus scraping traffic
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 8080
    # 2. In-namespace test client
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: traffic-generator
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-traffic-generator-egress
  namespace: app-workload
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traffic-generator
  policyTypes:
    - Egress
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: go-telemetry-api
      ports:
        - protocol: TCP
          port: 8080
