apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-telemetry-api
  namespace: app-workload
  labels:
    app.kubernetes.io/name: go-telemetry-api
    app.kubernetes.io/part-of: runtime-platform
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: go-telemetry-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: go-telemetry-api
        app.kubernetes.io/part-of: runtime-platform
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: go-telemetry-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            limits:
              cpu: 200m
              memory: 128Mi
            requests:
              cpu: 50m
              memory: 64Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: tmp-volume
              mountPath: /tmp
      volumes:
        - name: tmp-volume
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
