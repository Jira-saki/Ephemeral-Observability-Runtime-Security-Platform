apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: go-telemetry-api-monitor
  namespace: app-workload
  labels:
    release: prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: go-telemetry-api
  endpoints:
    - port: http
      path: /metrics
      interval: 10s
      scrapeTimeout: 5s
